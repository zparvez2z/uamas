name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ATTRIBUTE_PROVIDER: "mock"
  ENABLE_SEMANTIC_SCORER: "false"
  SEMANTIC_PROVIDER: "disabled"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Scan tracked files for secrets
        run: python scripts/check_secrets.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Train classifier artifact
        run: python scripts/train_classifier.py --force

      - name: Verify classifier runtime consistency
        run: |
          python -c "from reliable_genai.pipeline import ReliabilityPipeline; p = ReliabilityPipeline(); d = p.classifier.diagnostics(); assert d['runtime'] == 'ARTIFACT', d; assert d.get('artifact_rejection_reason') is None, d"

      - name: Verify strict artifact compatibility checks
        run: python -m pytest tests/test_classifier.py -k "unsupported_artifact_version or missing_required_metadata_field"

      - name: Verify strict-mode opt-out compatibility
        run: python -m pytest tests/test_classifier.py -k "strict_metadata_can_be_disabled_for_artifact_compatibility or pipeline_loads_classifier_artifact_with_opt_out"

      - name: Run tests
        run: python -m pytest

      - name: Compile Python modules
        run: python -m compileall app reliable_genai scripts tests
