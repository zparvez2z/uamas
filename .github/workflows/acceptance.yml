name: Acceptance

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  USE_MOCK_LLM: "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train classifier artifact
        run: python scripts/train_classifier.py --force

      - name: Verify classifier runtime consistency
        run: |
          python -c "from reliable_genai.pipeline import ReliabilityPipeline; p = ReliabilityPipeline(); d = p.classifier.diagnostics(); assert d['runtime'] == 'ARTIFACT', d; assert d.get('artifact_rejection_reason') is None, d"

      - name: Run sampled mock evaluation smoke check
        run: python scripts/evaluate.py --sample-size 250 --output /tmp/ci-results.md

      - name: Run sampled review acceptance section smoke check
        run: python scripts/evaluate.py --mock --sample-size 250 --with-review-acceptance-check --output /tmp/results-with-acceptance.md

      - name: Verify evaluation evidence
        run: |
          test -s /tmp/ci-results.md
          grep -q "Review Trigger Reduction Acceptance Check" /tmp/results-with-acceptance.md
