name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      enable_langgraph_review:
        description: "Enable review graph for this smoke run"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      USE_MOCK_LLM: "false"
      ENABLE_LANGGRAPH_REVIEW: ${{ inputs.enable_langgraph_review }}
      GITHUB_MODELS_ENDPOINT: "https://models.github.ai/inference"
      GITHUB_MODELS_MODEL: "openai/gpt-4.1"
      GITHUB_TOKEN: ${{ secrets.MODELS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate required live secret
        run: |
          test -n "${GITHUB_TOKEN}" || (echo "Missing required secret: MODELS_API_KEY" && exit 1)

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train classifier artifact
        run: python scripts/train_classifier.py --force

      - name: Run strict live smoke verification
        run: python scripts/live_smoke.py
