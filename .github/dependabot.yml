version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      routine-python:
        patterns:
          - "*"
        exclude-patterns:
          - "accelerate"
          - "bitsandbytes"
          - "fastapi"
          - "langgraph"
          - "pydantic"
          - "pytest"
          - "scikit-learn"
          - "sentence-transformers"
          - "transformers"
          - "uvicorn"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
