<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAMAS Administrator Login</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container login-container">
    <section class="card login-card">
      <h1>Administrator Login</h1>
      <p class="subtitle">Authenticate to access UAMAS operations and review tools.</p>

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/admin/login">
        <input type="hidden" name="next_path" value="{{ next_path }}">
        <label for="admin-token">Administrator Token</label>
        <input
          id="admin-token"
          name="admin_token"
          type="password"
          autocomplete="current-password"
          required
        >
        <button type="submit">Sign In</button>
      </form>
    </section>
  </main>
</body>
</html>
